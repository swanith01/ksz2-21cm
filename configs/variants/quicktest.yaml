# =============================================================================
# quicktest.yaml — small/fast variant of fiducial.yaml for debugging the
# pipeline itself (e.g. on a laptop, or checking a code change didn't break
# anything) before committing to a full-resolution cluster run.
#
# CHECK: this only overrides a few fields for illustration — inherit-and-
# override isn't wired up automatically (plain yaml, no OmegaConf), so this
# is a full standalone copy of fiducial.yaml with smaller numbers. Keep it
# in sync by hand, or introduce a merge step in utils/config.py if this
# pattern gets used often.
# =============================================================================

run_name: quicktest

paths:
  # Lives inside the repo (runs/), not the home directory — quicktest is a
  # throwaway smoke test, easy to find and `rm -rf` from one place. Relative
  # paths resolve from wherever you run the script FROM, so always run these
  # from the repo root (as in every example in this repo). runs/ is
  # git-ignored (see .gitignore), so this never gets committed.
  #
  # fiducial.yaml deliberately stays under ~/ (or scratch storage on the
  # cluster) rather than following this same pattern — a real HII_DIM=128,
  # 20-seed run can be many GB, and tying that to wherever your git checkout
  # happens to sit is a liability (e.g. an accidental repo-directory cleanup
  # taking real results down with it). quicktest is small and disposable;
  # fiducial isn't.
  cache_dir: runs/quicktest/cache
  plot_dir:  runs/quicktest/plots

simulation:
  hii_dim: 32          # much smaller than fiducial's 128 — fast, not physical
  box_len: 300
  z_min: 5.0
  z_max: 15.0           # narrower range — fast
  n_threads: 4
  random_seeds: [1, 2]  # 2 seeds instead of 20 — fast, no seed-scatter stats

ksz:
  z_obs: 5.0

cross_correlation:
  k_par_min: 0.01
  delta_z: 2.0
  z_chunk_centres: [8, 9]

cosmology:
  use: custom
  H0: 67.77
  Om0: 0.3086

snr:
  f_sky: 0.024
  cmb_experiments: [SO]
  radio_experiments: [HERA]
